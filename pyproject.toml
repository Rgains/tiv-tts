[project]
name = "tiv-tts"
version = "0.1.0"
description = "Reproducible Tiv text-to-speech dataset and smoke-test pipeline"
requires-python = ">=3.11,<3.12"
dependencies = [
    "numpy>=1.26,<2",
    "pyyaml>=6.0",
    "soundfile>=0.13",
    "torch>=2.7,<2.9",
    "torchaudio>=2.7,<2.9",
]

[dependency-groups]
demo = [
    "streamlit>=1.56.0",
]
dev = [
    "pytest>=8.0",
]
research = [
    "coqui-tts==0.27.5",
    "matcha-tts==0.0.7.2",
    "transformers>=4.57,<5",
    "torchvision>=0.22,<0.24",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tiv_tts"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
